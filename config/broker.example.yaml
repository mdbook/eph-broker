# eph-broker config. Copy to config/broker.yaml (or point BROKER_CONFIG at it) and fill in your values.
# Every section is optional. A section here replaces the config/<name>.json file of the same name; a
# BROKER_CONFIG path ending in .json is read as JSON, so you don't need PyYAML for that.
# An unknown section, a repeated key or a parse error stops the broker at startup.

# Case-insensitive literal substrings forbidden in final worker model ids. Empty = unrestricted.
# Checked at launch for every harness, including backend/env model remapping. Reload with SIGHUP.
model_denylist: []

# Keep tickets assigned to their owner while waiting on a dependency. Exact label names (case-insensitive)
# or positive integer ids. Default: [blocked]; [] disables this gate. Restart after changing it.
# Id matching needs an id-aware tap (label_ids or full label objects); the bundled tap sends names.
hold_labels: [blocked]

# Environment settings, the same keys as config/site.example.env. The real environment wins over these,
# and these win over site.env. Values are strings, numbers or true/false (true becomes "1"). Quote anything
# YAML might read as something else (on, off, 0755). On SIGHUP, runtime settings below override the startup
# defaults (including env); paths, ports and identities still require restart. See README's inventory.
# Never put secrets here, see docs/configuration.md#secrets.
settings:
  TICKET_URL_TEMPLATE: "https://tracker.example.com/tasks/{}"
  GITLAB_WEB_URL: "https://gitlab.example.com"
  BROKER_PUSH_HOSTS: "gitlab.example.com"
  # Bot DMs for workers with a bus identity. Default: *-bot@* on that bus.
  AGENT_DM_RECIPIENTS: "*-bot@chat.example.com"
  # Triage DMs the human directly, independently of OPS_HANDLE (which may be an ops bot).
  OPERATOR_DM_HANDLE: "operator@chat.example.com"
  GENERAL_REPO_ALLOWLIST: "/srv/git/app:/srv/git/docs-site"
  CODE_REPO_ALLOWLIST: "/srv/git/app:/srv/git/docs-site"
  CONCURRENCY: 5
  DISPATCH_PRIORITY: "reviews-first"
  MAX_SPAWNS_PER_HOUR: 60
  ROW_CONCURRENCY: ""  # example: code=2,mr-review=1; 0 pauses a group without killing workers
  CD_ENABLED: false
  # MR_REVIEWER_MODEL: "sonnet"  # explicit pin wins even for a full-tier review
  # OS isolation (requires bubblewrap). "off" is an explicit, unsafe rollout/rollback override.
  WORKER_SANDBOX: "bwrap"
  # Colon-separated absolute paths; hides always win over read-only or writable binds.
  WORKER_SANDBOX_EXTRA_RO: ""
  WORKER_SANDBOX_HIDE: ""
  # Reviewed non-secret filename exceptions for eph-gate (Hermes/Codex), empty by default.
  # Exact catalog repo keys, repo-relative globs. Dotfiles and escaping symlinks stay denied.
  # EPH_GATE_NONSECRET_PATHS: '{"example/module-box":["modules/*/module.env"]}'
  # Per-row commit metadata (push credentials are unchanged). Default: eph-<row>@noreply.invalid.
  CODE_GIT_NAME: "eph-code"
  CODE_GIT_EMAIL: "eph-code@example.com"
  # CODE_GIT_IDENTITY_ENABLED: false  # only if existing server/credential rules reject bot metadata
  # Private local storage for durable maintenance drain and queued intake (docs/drain.md).
  BROKER_STATE_PATH: "/var/lib/eph-broker/broker-state.sqlite3"
  # Opt in before the FIRST journal initialization to start already drained.
  # Existing persisted drain values, including false, remain authoritative.
  BROKER_DRAIN_ON_NEW_JOURNAL: false

# Your own agent types (docs/routes.md). Same rows as config/routes.json, as a list. Read at startup.
# Each row's prompt must exist and be signed, or the broker refuses to start.
# routes:
#   - id: docs
#     match: {label: "eph:docs"}
#     prompt: docs/writer
#     capability: code
#     repo: /srv/git/docs-site
#   - id: triage
#     match: {assignee: triage-bot}
#     prompt: triage/read-only
#     capability: read
#     repo: /srv/git/app
#     model: sonnet

# Your own capabilities (docs/routes.md#site-capabilities): a built-in base (read, code or general) plus extra
# rules appended to its allow and deny lists. The base's deny list always wins. Read at startup.
# capabilities:
#   docs-writer:
#     base: code
#     allow: ["Bash(wc -w:*)"]
#     deny: [WebFetch]

# Turn caps and wall-clock limits (config/constraints.json). Reload with SIGHUP.
# Positive fractional durations are supported, e.g. wall_clock_s: 0.5. Running invocations keep their timeout.
constraints:
  max_turns: 50
  max_turns_by_capability: {code: 100, inbox: 15}
  wall_clock_s: 1800
  wall_clock_by_capability: {code: 3600, inbox: 1800}
  inbox_max_input_tokens: 3000000  # Defaults off for local backends; see inbox_input_token_limit row override.
  inbox_max_cost_usd: 2.0
  # Inbox CC pricing: exact launch AND observed model ids, USD per million tokens. Review provider rates.
  # Unknown launch/internal models fail loud. Include backend/fallback ids, aliases and internally routed tiers.
  model_prices:
    sonnet: {input_tokens: 3.0, output_tokens: 15.0, cache_read_input_tokens: 0.3, cache_creation_input_tokens: 3.75}
    example-local-model: {input_tokens: 0, output_tokens: 0, cache_read_input_tokens: 0, cache_creation_input_tokens: 0}
  max_forwards: 10
  rotate_turns: 20
  rotate_tokens: 120000

# Burst and warm windows in seconds (config/windows.json). Re-read on SIGHUP.
windows:
  initial: {"vikunja:task": 3, alert: 2}
  receive: {"vikunja:task": 45, alert: 60}

# Who counts as an agent (config/provenance.json, all five keys required). Read at startup.
# provenance:
#   agent_basenames: [svc-account]
#   handoff_doers: [svc-account]
#   agent_pattern: '(-bot\b|@agents\.example\.com$)'
#   untrusted_authors: [svc-account]
#   handoff_parked_labels: [awaiting-input, blocked]

# The other sections take the content of their json file as is: inbox-accounts, zulip-wake, cd-tier,
# deploy-paths, pool-vikunja-ids.
