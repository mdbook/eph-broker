<!DOCTYPE html>
<!--
  Mockup for ticket 3193, phase 1c: the Agents tab's hermes view and the Fleet quick view, drawn as the sidecar view's
  transcript (the renderer viewer/ui.js mounts today) living natively inside a broker card. Static and
  self-contained. The data is made up and nothing here talks to the broker. Phase 2 builds it.

  Kept from the sidecar view, on purpose (feature parity):
    - A transcript, not a chat app. A left gutter carries speaker and time, with a thin tinted rule down it.
      There are no bubbles.
    - Replies set in the sidecar view's reading serif, full width, with code, tables and lists. Tool calls are dark
      terminal wells holding the command, its output, the exit code and the duration. Thinking is quiet italic
      under a hairline.
    - Every turn has a tally: one tick per tool call (height = how long it ran, red = failed), the summary
      ("5 tool calls, 38s") and a Show/Hide steps toggle. Earlier turns start folded.
    - Date dividers, Load earlier, the live tail line ("thinking for 0:31"), copy buttons, turn actions.
    - Header controls: session picker, live state ("thinking for 0:31" / "idle, last step 10:46"), model and
      token count (opens the context panel), files, search, Hide steps.
    - Composer: attach, "Message atlas, or / for commands" with the slash menu, Send, and while the agent is
      busy Stop, Interrupt and Queue (Send becomes Queue), plus the queued-message list.

  Changed for the broker (integration only):
    - ONE header row. the sidecar view's header takes the broker's name, status chip and harness. No second card
      header, no fox logo, no per-view theme toggle: colors follow the dash theme button (try it).
    - No vignette and no gradient. The composer is a solid strip pinned to the bottom of the card, and nothing
      paints outside the card.
    - the sidecar view's palette maps onto the dash tokens (docs/DESIGN.md); type, spacing and layout stay the sidecar view's.
      The tool wells stay dark in both themes.
    - The view is a size container. Under 720px of view width (a phone, the Fleet quick view, a narrow window)
      the gutter folds inline like the sidecar view's phone layout, the header wraps to a second line and the header
      tools move behind "···".

  QA bar (from phase 1b): every control in a row takes its height from --ctl (36px, 44px on phones), so a text
  box and the buttons beside it line up by construction; no horizontal overflow at 390px.
  Phone pass (fix round 2): every tap target at least 44px. The per-turn actions fold into one "···" menu,
  copy buttons get a line of their own, the harness drops under the name so the session picker shows in full,
  and the composer placeholder shortens to "Message atlas".
-->

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>eph-broker · Agents mockup</title>
<style>
  /* ---- dash tokens (dash.PAGE), unchanged */
  :root{
    color-scheme:light;
    --bg:#f4f5f7; --s1:#ffffff; --s2:#f0f2f5; --s3:#e6e9ee; --line:#dce0e6;
    --t1:#141920; --t2:#475160; --t3:#626c7b; --brand:#2b57c9; --onbrand:#ffffff;
    --run:#17734a; --wait:#8a5600; --block:#bb3328; --shadow:0 1px 2px rgba(20,25,32,.05);
    --r:12px; --pop:0 8px 24px rgba(20,25,32,.12);
    --well:#1c2027;
    --ctl:36px;
  }
  :root[data-theme=dark]{
    color-scheme:dark;
    --bg:#0f1216; --s1:#161a20; --s2:#1d222a; --s3:#262c35; --line:#2b323c;
    --t1:#e8ecf1; --t2:#aab3bf; --t3:#8a94a2; --brand:#8eabff; --onbrand:#0c1120;
    --run:#4cc38a; --wait:#e3a63d; --block:#f27c71; --shadow:none; --pop:0 8px 24px rgba(0,0,0,.45);
    --well:#0a0c10;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme=light]){
      color-scheme:dark;
      --bg:#0f1216; --s1:#161a20; --s2:#1d222a; --s3:#262c35; --line:#2b323c;
      --t1:#e8ecf1; --t2:#aab3bf; --t3:#8a94a2; --brand:#8eabff; --onbrand:#0c1120;
      --run:#4cc38a; --wait:#e3a63d; --block:#f27c71; --shadow:none; --pop:0 8px 24px rgba(0,0,0,.45);
      --well:#0a0c10;
    }
  }
  /* Phones: every control grows to the 44px tap target. */
  @media (max-width:720px){ :root{--ctl:44px} }

  *{box-sizing:border-box}
  [hidden]{display:none !important}
  body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
       background:var(--bg);color:var(--t1);-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--brand);outline-offset:2px}

  /* ---- dash chrome (unchanged, here for context) */
  .top{position:sticky;top:0;z-index:5;background:var(--s1);border-bottom:1px solid var(--line)}
  .top-in{max-width:1440px;margin:0 auto;padding:0 40px;height:64px;display:flex;align-items:center;gap:28px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:650;font-size:16px;letter-spacing:-.01em;white-space:nowrap}
  .logo{width:24px;height:24px;border-radius:7px;background:var(--brand);position:relative;flex:none}
  .logo::before,.logo::after{content:"";position:absolute;left:22%;height:14%;border-radius:2px;background:var(--onbrand)}
  .logo::before{top:30%;width:56%} .logo::after{top:56%;width:36%}
  .inst{font-weight:400;font-size:13px;color:var(--t2)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--run)}
  .nav{display:flex;align-self:stretch;gap:4px}
  .nav a{display:flex;align-items:center;padding:0 14px;text-decoration:none;color:var(--t2);font-size:14px;border-bottom:3px solid transparent;margin-bottom:-1px}
  .nav a:hover{color:var(--t1)}
  .nav a[aria-current=page]{color:var(--t1);font-weight:600;border-bottom-color:var(--brand)}
  .top-r{margin-left:auto;display:flex;align-items:center;gap:12px}
  .btn{display:inline-flex;align-items:center;justify-content:center;height:var(--ctl);min-width:var(--ctl);padding:0 16px;border-radius:8px;
       border:1px solid var(--line);background:var(--s1);color:var(--t1);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
  .btn.ghost{background:transparent;border-color:transparent}.btn.ghost:hover{background:var(--s2);border-color:var(--line)}
  .btn.sq{width:var(--ctl);padding:0}
  .lnk{display:inline-flex;align-items:center;color:var(--brand);font-weight:600;text-decoration:none;background:none;border:0;padding:0;
       cursor:pointer;font-size:14px;line-height:20px;min-height:var(--ctl);white-space:nowrap;border-radius:4px}
  .lnk:hover{text-decoration:underline}
  .page{max-width:1440px;margin:0 auto;padding:32px 40px 32px}
  .ph h1{margin:0 0 20px;font-size:28px;line-height:1.2;font-weight:650;letter-spacing:-.02em}
  .seg{display:inline-flex;height:var(--ctl);background:var(--s3);border-radius:9px;padding:3px;gap:2px}
  .seg button{border:0;background:none;border-radius:7px;padding:0 12px;font-size:13px;font-weight:600;color:var(--t2);cursor:pointer;white-space:nowrap}
  .seg button[aria-pressed=true]{background:var(--s1);color:var(--t1);box-shadow:var(--shadow)}
  .card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}

  /* mockup-only control strip (not part of the design) */
  .mock{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;margin:0 0 16px;padding:8px 16px;border:1px dashed var(--line);
        border-radius:10px;font-size:13px;color:var(--t2)}
  .mock b{font-weight:600;color:var(--t1)}

  /* Agents directory (viewer .adir, unchanged) */
  .adir{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:start}
  .adir-list{padding:4px 0}
  .adir-it{display:flex;align-items:center;gap:12px;padding:14px 20px 14px 17px;border-left:3px solid transparent;color:inherit;text-decoration:none}
  .adir-it:hover{background:var(--s2)}
  .adir-it[aria-current=true]{background:color-mix(in srgb,var(--brand) 7%,var(--s1));border-left-color:var(--brand)}
  .adir-it.grey{color:var(--t2)}.adir-grow{flex:1;min-width:0}.adir-nm{font-weight:600}
  .adir-meta{font-size:13px;color:var(--t2)}
  .adir-dot{width:8px;height:8px;border-radius:50%;background:var(--brand)}
  /* The card clips: nothing the view paints (popovers included) can leak past its border. */
  .adir-detail{position:sticky;top:80px;height:calc(100dvh - 96px);overflow:hidden;display:flex}

  /* status chip (viewer .ad-st) */
  .ad-st{flex:none;display:inline-flex;align-items:center;gap:8px;height:24px;font:600 13px/20px -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
    padding:0 10px;border-radius:999px;white-space:nowrap;color:var(--t2);background:color-mix(in srgb,currentColor 13%,var(--s1))}
  .ad-st::before{content:'';flex:none;box-sizing:border-box;width:8px;height:8px;border-radius:50%;border:1.5px solid var(--t3)}
  .ad-st.run{color:var(--run)}.ad-st.run::before{border:0;background:currentColor}

  /* ======================================================================================================
     The agent view: the sidecar view, native. the sidecar view's tokens are re-pointed at the dash tokens here, so its rules
     read as they do upstream and the dash theme button recolors an open view without remounting it.
     ====================================================================================================== */
  .ov{
    --ground:var(--s1); --panel:var(--s2); --rule:var(--line); --rule2:color-mix(in srgb,var(--t1) 16%,var(--line));
    --ink:var(--t1); --dim:var(--t2); --faint:var(--t3);
    --iris:var(--brand); --amber:var(--wait); --bad:var(--block);
    --you:var(--brand); --agent:var(--run);
    /* the terminal wells stay dark in both themes */
    --w-ink:#eef1f5; --w-term:#c6ccd5; --w-dim:#9aa3af; --w-amber:#e3a63d; --w-bad:#f27c71; --w-add:#5fd19a; --w-del:#f58f85; --w-hunk:#9db6ff;
    --serif:"Iowan Old Style","Charter","Bitstream Charter","Source Serif 4","Sitka Text",Cambria,Georgia,serif;
    --sans:"Avenir Next","Seravek","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Mono","JetBrains Mono",Menlo,Consolas,monospace;
    --gut:5.4rem; --w:64rem; --edge:20px;
    --ease:cubic-bezier(.2,0,0,1); --q:120ms; --s:220ms;
    container:ov/inline-size;
    position:relative;flex:1;min-width:0;height:100%;display:flex;flex-direction:column;
    background:var(--ground);color:var(--ink);font:15px/1.5 var(--sans);-webkit-text-size-adjust:100%;
  }
  .ov ::selection{background:color-mix(in srgb,var(--iris) 22%,transparent)}
  .ov svg.i{width:1rem;height:1rem;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

  /* ---- the one header row */
  .bar{flex:none;position:relative;z-index:3;display:flex;align-items:center;gap:8px 14px;min-width:0;
       padding:10px var(--edge);border-bottom:1px solid var(--rule);background:var(--ground)}
  .back{display:none;align-items:center;min-height:var(--ctl);margin-left:-8px;padding:0 8px;border-radius:8px;
        color:var(--iris);font:600 14px var(--sans);text-decoration:none;white-space:nowrap}
  .back:hover{background:var(--panel)}
  .idn{display:flex;align-items:center;gap:10px;min-width:0;flex:0 1 auto}
  .nm{margin:0;font:600 1.3rem/1.2 var(--serif);letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .hz{color:var(--dim);font-size:.84rem;white-space:nowrap}
  .sesswrap{flex:0 1 auto;min-width:0}
  .sess{display:block;max-width:16rem;width:100%;height:var(--ctl);background-color:transparent;color:var(--ink);border:1px solid transparent;border-radius:8px;
    padding:0 1.5rem 0 .5rem;font:500 .9rem var(--sans);cursor:pointer;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(-45deg,transparent 50%,var(--dim) 50%);
    background-size:4px 4px;background-position:calc(100% - .75rem) 55%,calc(100% - .5rem) 55%;background-repeat:no-repeat;
    transition:background-color var(--q) var(--ease)}
  .sess:hover,.sess[aria-expanded=true]{background-color:var(--panel)}
  .state{color:var(--dim);font-size:.84rem;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .ov.busy .state{color:var(--amber)}
  .grow{flex:1 1 0}
  .brk{display:none}
  .tools{display:flex;align-items:center;gap:4px;flex:none}
  /* header buttons: quiet until hovered, one control tall */
  .hb{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:var(--ctl);min-width:var(--ctl);padding:0 10px;flex:none;
      background:none;border:1px solid transparent;border-radius:8px;color:var(--dim);font:.8rem var(--sans);cursor:pointer;white-space:nowrap;
      transition:color var(--q) var(--ease),background var(--q) var(--ease),border-color var(--q) var(--ease)}
  .hb:hover,.hb[aria-expanded=true]{color:var(--ink);background:var(--panel)}
  .hb.ic{padding:0}
  .hb .lb{display:none}
  .stats{color:var(--faint);font-variant-numeric:tabular-nums}.stats b{font-weight:500;color:var(--dim)}
  .hb.steps[aria-pressed=true]{color:var(--ink);border-color:var(--rule2)}
  .more,.close{display:none}

  /* popovers (session list, context, files) hang from the header and stay inside the card */
  .pop{position:absolute;z-index:8;top:calc(100% - 4px);right:var(--edge);width:min(24rem,calc(100% - 2 * var(--edge)));max-height:60vh;overflow:auto;
       background:var(--ground);border:1px solid var(--rule2);border-radius:10px;box-shadow:var(--pop);padding:6px}
  .pop.left{left:var(--edge);right:auto}
  .pop h3{margin:6px 8px 8px;font:600 1.05rem var(--serif)}
  .pop .k{margin:10px 8px 4px;font:600 .7rem var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
  .pop p{margin:4px 8px;font-size:.86rem;color:var(--dim)}
  .so{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 10px;min-height:var(--ctl);border-radius:6px;color:var(--ink);cursor:pointer}
  .so:hover,.so[aria-selected=true]{background:var(--panel)}
  .so .sn{display:block;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .so .sm{display:block;font-size:.74rem;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .so.on .sn::before{content:"";display:inline-block;width:.4rem;height:.4rem;border-radius:50%;background:var(--agent);margin-right:.45rem;vertical-align:.1em}
  .cbar{display:flex;height:.6rem;margin:6px 8px;border-radius:99px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--rule);overflow:hidden}
  .cbar i{display:block;background:var(--c)}
  .legend{display:grid;gap:2px;list-style:none;margin:6px 8px;padding:0;font-size:.8rem;color:var(--dim)}
  .legend li{display:flex;align-items:center;gap:8px}.legend li::before{content:"";width:.55rem;height:.55rem;border-radius:2px;background:var(--c)}
  .legend .n{margin-left:auto;color:var(--ink);font-variant-numeric:tabular-nums}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 8px 8px}
  .chips button{font:.8rem var(--sans);min-height:32px;background:var(--panel);border:1px solid var(--rule2);border-radius:99px;padding:0 12px;color:var(--ink);cursor:pointer}
  .chips button[aria-pressed=true]{border-color:var(--iris);color:var(--iris)}
  .ent{border-top:1px solid var(--rule);padding:8px;font-size:.86rem;overflow-wrap:anywhere}

  /* search row, under the header (the sidecar view #search) */
  /* lines up with the transcript column, which is centered once the view is wider than --w */
  .search{flex:none;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--rule);
    padding:8px max(var(--edge),calc((100% - var(--w)) / 2 + var(--edge))) 10px max(calc(var(--edge) + var(--gut) + 1rem),calc((100% - var(--w)) / 2 + var(--edge) + var(--gut) + 1rem))}
  .search input{flex:1;min-width:0;height:var(--ctl);background:var(--panel);color:var(--ink);border:1px solid var(--rule2);border-radius:8px;padding:0 10px;font:.92rem var(--sans)}
  .search input:focus{outline:none;border-color:var(--iris)}
  .qn{color:var(--dim);font-size:.8rem;font-variant-numeric:tabular-nums;white-space:nowrap}

  /* ---- the transcript */
  .log{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:4px 0 24px}
  .lw{max-width:var(--w);margin:0 auto;padding:0 var(--edge)}
  .earlier{display:grid;grid-template-columns:var(--gut) minmax(0,1fr);column-gap:1rem;margin:4px 0 0}
  .tgl{background:none;border:0;padding:0;color:var(--dim);font:.76rem var(--sans);cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px;
       min-height:28px;white-space:nowrap}
  .tgl:hover{color:var(--ink)}
  .earlier .tgl{grid-column:2;justify-self:start;color:var(--faint);font-size:.8rem}
  .row{display:grid;grid-template-columns:var(--gut) minmax(0,1fr);column-gap:1rem}
  .gut{padding:.6rem .8rem .5rem 0;border-right:2px solid var(--rail,var(--rule2));text-align:right;
       font-size:.72rem;line-height:1.35;color:var(--faint);font-variant-numeric:tabular-nums}
  .who{display:block;font-size:.8rem;font-weight:600;color:var(--dim);margin-bottom:.05rem}
  .ch{display:block;font-size:.68rem;font-weight:500;letter-spacing:.02em;color:var(--faint);margin-bottom:.1rem}
  .bd{padding:.5rem 0;min-width:0;position:relative}
  .ag{--rail:color-mix(in srgb,var(--agent) 45%,var(--rule))}
  .ag .who{color:var(--agent)}
  .in{margin-top:1.4rem;--rail:var(--you)}
  .in .who{color:var(--you)}
  .in .bd{font-size:1rem;line-height:1.55;max-width:72ch;overflow-wrap:anywhere}
  .day{margin-top:2.2rem}
  .day .gut{border-right-color:transparent}
  .day .bd{display:flex;align-items:center;gap:.8rem;padding:.1rem 0;color:var(--dim);font:600 .82rem var(--sans)}
  .day .bd::after{content:"";flex:1;border-top:1px solid var(--rule)}

  /* the agent's prose */
  .think{color:var(--dim);font-size:.85rem;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;max-width:76ch;margin:.05rem 0 .4rem;
         padding-left:.7rem;border-left:1px solid var(--rule2);font-style:italic}
  .reply{font:1.06rem/1.62 var(--serif);max-width:68ch;overflow-wrap:anywhere;margin:.1rem 0;color:var(--ink)}
  .md>:first-child{margin-top:0}.md>:last-child{margin-bottom:0}
  .md p{margin:.5em 0}.md ul,.md ol{margin:.45em 0;padding-left:1.4em}.md li{margin:.2em 0}
  .md strong{font-weight:650}
  .md code{font:.8em var(--mono);background:var(--panel);border:1px solid var(--rule);padding:.05em .32em;border-radius:3px}
  .md pre{position:relative;font:12.5px/1.55 var(--mono);background:var(--well);color:var(--w-term);padding:.6rem .8rem;border-radius:4px;
          white-space:pre-wrap;overflow-wrap:anywhere;margin:.6em 0}
  .md pre[data-lang]::before{content:attr(data-lang);float:right;margin:0 0 .2rem .8rem;font:10.5px/1.9 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--w-dim)}
  .md .tbl{overflow-x:auto}
  .md table{border-collapse:collapse;font:.88em/1.45 var(--sans);margin:.6em 0}
  .md th,.md td{border:1px solid var(--rule2);padding:.25em .6em;text-align:left;vertical-align:top}
  .md th{font-weight:650;background:var(--panel)}
  .add{color:var(--w-add)}.del{color:var(--w-del)}.hunk{color:var(--w-hunk)}

  /* tool wells: dark terminal blocks with the command, its output, exit code and duration */
  .term{position:relative;background:var(--well);border-radius:4px;padding:.55rem .8rem;margin:.35rem 0 .5rem;max-width:52rem;
        font:12.5px/1.55 var(--mono);color:var(--w-term);overflow-wrap:anywhere;border-left:2px solid transparent}
  .term.failed{border-left-color:var(--w-bad)}
  .term pre{margin:0;font:inherit;white-space:pre-wrap;overflow-wrap:anywhere}
  .cmd{color:var(--w-ink)}
  .ps{color:var(--w-amber);user-select:none}
  .tool{color:var(--w-amber);font-weight:600}
  .dpath{color:var(--w-dim);margin:.1rem 0 .3rem}
  .out{margin-top:.45rem;padding-top:.45rem;border-top:1px dashed color-mix(in srgb,var(--w-dim) 35%,transparent)}
  .term dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:.05rem 1rem;margin:.2rem 0 0}
  .term dt{color:var(--w-dim)}.term dd{margin:0;color:var(--w-ink);min-width:0}
  .meta{display:flex;flex-wrap:wrap;gap:.2rem 1.2rem;margin-top:.45rem;color:var(--w-dim);font:11.5px var(--sans);font-variant-numeric:tabular-nums}
  .meta .bad{color:var(--w-bad);font-weight:600}
  .running{display:flex;align-items:center;gap:.5em;margin-top:.35rem;color:var(--w-amber);font:.78rem var(--sans)}
  .running::before,.tail .bd::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:currentColor;animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.3}}

  /* copy: there on hover, a little on touch */
  .cp{position:absolute;top:.3rem;right:.35rem;z-index:1;background:var(--ground);border:1px solid var(--rule2);border-radius:5px;color:var(--dim);
      font:.7rem var(--sans);padding:.2rem .4rem;cursor:pointer;opacity:0;transition:opacity var(--q) var(--ease)}
  .term .cp{background:color-mix(in srgb,var(--well) 80%,#fff 8%);color:var(--w-dim);border-color:color-mix(in srgb,var(--w-dim) 40%,transparent)}

  .cin{max-width:var(--w);margin:0 auto;padding:0 var(--edge) 0 calc(var(--edge) + var(--gut) + 1rem);display:grid;gap:8px}

       transition:border-color var(--q) var(--ease)}

  .attach{flex:none;width:var(--ctl);height:var(--ctl);display:grid;place-items:center;background:none;border:0;border-radius:6px;color:var(--faint);cursor:pointer}
  .attach:hover{color:var(--ink);background:var(--panel)}
  .msg{flex:1;min-width:0;resize:none;display:block;margin:0;height:var(--ctl);min-height:var(--ctl);max-height:40vh;overflow-y:auto;
       background:transparent;color:var(--ink);border:0;outline:0;padding:calc((var(--ctl) - 1.45rem) / 2) 4px;font:1rem/1.45 var(--sans)}

  /* broker's "what it is doing" line, quick view only */

  .qnow b{color:var(--ink);font-weight:600;margin-right:6px}.qnow .w{color:var(--amber);font-weight:600}

  /* ---- compact view: under 720px of VIEW width (phone, quick view, narrow window). the sidecar view's phone layout. */

    /* turn actions: one 44px "···" at the end of the tally, opening a menu of full-height rows */

    .cp{position:static;display:inline-flex;align-items:center;justify-content:center;min-height:var(--ctl);min-width:var(--ctl);
        margin:.15rem 0 0 -.5rem;padding:0 .5rem;background:none;border-color:transparent;opacity:1;font-size:.8rem;color:var(--faint)}

  /* ---- Fleet quick view: the dash detail sheet holding the same view */
  .detail-sheet{padding:0;color:var(--t1);width:min(640px,calc(100% - 32px));height:min(720px,calc(100dvh - 32px));
                background:var(--s1);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .detail-sheet[open]{display:flex}

        <span class="sum" data-busy>3 tool calls, 1m 12s</span><span class="sum" data-idle hidden>3 tool calls, 1m 53s</span>
        <span class="tsep" aria-hidden="true">·</span><button class="tgl" type="button" data-fold>Hide steps</button>
        <span class="tacts"><button class="tgl tmore" type="button" aria-label="Turn actions" aria-haspopup="menu" aria-expanded="false" data-tmenu>···</button><span class="tlist"><button class="tgl" type="button">link</button><button class="tgl" type="button">copy md</button><button class="tgl" type="button">save .md</button></span></span>

      </ul>
      <div class="slash" role="listbox" aria-label="Commands" hidden>
        <div class="opt" role="option" aria-selected="true"><span class="n">/retry</span><span class="d">Run the last message again</span></div>
        <div class="opt" role="option" aria-selected="false"><span class="n">/model</span><span class="d">Switch the model for this session</span></div>
        <div class="opt" role="option" aria-selected="false"><span class="n">/compact</span><span class="d">Summarise earlier turns to free context</span></div>
        <div class="opt" role="option" aria-selected="false"><span class="n">/new</span><span class="d">Start a new session</span></div>

<script>
// Mockup behavior only. Nothing talks to the broker.
const root = document.documentElement, themes = ['auto', 'light', 'dark'], glyph = {auto: '◐', light: '☀', dark: '☾'};
let theme = 'auto';
document.getElementById('theme').onclick = (e) => {
  theme = themes[(themes.indexOf(theme) + 1) % 3];
  if (theme === 'auto') root.removeAttribute('data-theme'); else root.dataset.theme = theme;
  e.currentTarget.textContent = glyph[theme];
  e.currentTarget.title = e.currentTarget.ariaLabel = 'Theme: ' + theme;
};

const tpl = document.getElementById('t-view');
function build(slot, quick) {
  const v = tpl.content.firstElementChild.cloneNode(true);
  if (quick) {
    // The quick view is the same view: the newest turns, the broker's "Now" line, Close, and Open full view.
    v.querySelectorAll('[data-qv-only]').forEach((n) => { n.hidden = false; });
    v.querySelector('[data-close]').hidden = false;
    v.querySelector('.back').remove();
    const lw = v.querySelector('.lw'), keep = lw.querySelector('[data-turn="t2"]').previousElementSibling;
    while (lw.firstElementChild !== keep) lw.firstElementChild.remove();
    lw.prepend(Object.assign(document.createElement('div'), {className: 'earlier',
      innerHTML: '<button class="tgl" type="button">Load earlier</button>'}));
  }
  document.getElementById(slot).append(v);
}
build('view-slot', false);
build('quick', true);

const all = (sel) => document.querySelectorAll(sel);
function closePops() {
  all('[data-popbox]').forEach((p) => { p.hidden = true; });
  all('[data-pop],[data-overflow]').forEach((b) => b.setAttribute('aria-expanded', 'false'));
  all('.bar.open').forEach((b) => b.classList.remove('open'));
  all('.tacts.open').forEach((t) => { t.classList.remove('open'); t.querySelector('[data-tmenu]').setAttribute('aria-expanded', 'false'); });
}
function foldTurn(ov, id, fold) {
  const steps = ov.querySelectorAll('[data-step="' + id + '"]');
  steps.forEach((r) => r.classList.toggle('f', fold));
  const n = ov.querySelectorAll('[data-step="' + id + '"] .term, [data-step="' + id + '"] .think').length;
  const b = ov.querySelector('[data-turn="' + id + '"] [data-fold]');
  if (b) b.textContent = fold ? 'Show ' + n + (n > 1 ? ' steps' : ' step') : 'Hide steps';
}

document.addEventListener('click', (e) => {
  const ov = e.target.closest('.ov');
  const pop = e.target.closest('[data-pop]'), over = e.target.closest('[data-overflow]');
  if (pop) {
    const box = pop.closest('.bar').querySelector('[data-popbox="' + pop.dataset.pop + '"]'), show = box.hidden;
    closePops(); box.hidden = !show; pop.setAttribute('aria-expanded', String(show)); return;
  }
  if (over) {
    const bar = over.closest('.bar'), open = !bar.classList.contains('open');
    closePops(); bar.classList.toggle('open', open); over.setAttribute('aria-expanded', String(open)); return;
  }
  const tmenu = e.target.closest('[data-tmenu]');
  if (tmenu) {
    const t = tmenu.closest('.tacts'), open = !t.classList.contains('open');
    closePops(); t.classList.toggle('open', open); tmenu.setAttribute('aria-expanded', String(open)); return;
  }
  if (!e.target.closest('[data-popbox]')) closePops();
  if (!ov) return;
  const so = e.target.closest('.so');
  if (so) { ov.querySelector('.sess').textContent = so.querySelector('.sn').textContent; closePops(); }
  const fold = e.target.closest('[data-fold]');
  if (fold) { const id = fold.closest('[data-turn]').dataset.turn; foldTurn(ov, id, !ov.querySelector('[data-step="' + id + '"]').classList.contains('f')); }
  const steps = e.target.closest('[data-steps]');
  if (steps) {
    const hide = steps.getAttribute('aria-pressed') !== 'true';
    steps.setAttribute('aria-pressed', String(hide)); steps.textContent = hide ? 'Show steps' : 'Hide steps';
    ov.querySelectorAll('[data-turn]').forEach((t) => foldTurn(ov, t.dataset.turn, hide));
  }
  if (e.target.closest('[data-find]')) { const s = ov.querySelector('.search'); s.hidden = false; s.querySelector('input').focus(); closePops(); }
  if (e.target.closest('[data-find-close]')) closeSearch(ov);
  if (e.target.closest('[data-stop]')) setState('idle');
  if (e.target.closest('[data-unqueue]')) e.target.closest('li').remove();
  if (e.target.closest('[data-close]')) document.getElementById('quick').close();
  const opt = e.target.closest('.opt');
  if (opt) { const ta = ov.querySelector('.msg'); ta.value = opt.querySelector('.n').textContent + ' '; ta.focus(); ov.querySelector('.slash').hidden = true; }
  if (e.target.closest('.cp')) { const b = e.target.closest('.cp'); b.textContent = 'copied'; setTimeout(() => { b.textContent = 'copy'; }, 1200); }
  if (e.target.closest('[data-send]')) send(ov);
});

function closeSearch(ov) {
  const s = ov.querySelector('.search'); s.hidden = true; s.querySelector('input').value = '';
  ov.querySelectorAll('.row.hit').forEach((r) => r.classList.remove('hit')); s.querySelector('.qn').textContent = '';
}
function send(ov) {
  const ta = ov.querySelector('.msg'), text = ta.value.trim();
  if (!text) return;
  if (ov.classList.contains('busy')) {
    const li = document.createElement('li');
    li.innerHTML = '<span class="qt"></span><span class="qs">Queued</span><button class="hb" type="button" data-unqueue aria-label="Remove from the queue">Remove</button>';
    li.firstChild.textContent = text; ov.querySelector('.queue').append(li);
  } else {
    const row = document.createElement('div'); row.className = 'row in';
    row.innerHTML = '<div class="gut"><span class="who">sam</span><span class="ch">web</span>10:47 AM</div><div class="bd"></div>';
    row.lastChild.textContent = text; ov.querySelector('.lw').append(row);
    ov.querySelector('.log').scrollTop = 1e9;
  }
  ta.value = ''; grow(ta); ov.querySelector('.slash').hidden = true; ta.focus();
}
function grow(ta) {
  ta.style.height = '';
  if (ta.scrollHeight > ta.clientHeight) ta.style.height = (ta.scrollHeight + ta.offsetHeight - ta.clientHeight) + 'px';
}
document.addEventListener('input', (e) => {
  const ov = e.target.closest('.ov');
  if (e.target.matches('.msg')) { grow(e.target); ov.querySelector('.slash').hidden = !e.target.value.startsWith('/') || e.target.value.includes(' '); }
  if (e.target.matches('.search input')) {
    const q = e.target.value.trim().toLowerCase(); let n = 0;
    ov.querySelectorAll('.lw > .row.in, .lw > .row.ag').forEach((r) => {
      const hit = !!q && r.textContent.toLowerCase().includes(q); r.classList.toggle('hit', hit); n += hit;
    });
    ov.querySelector('.qn').textContent = q ? n + (n === 1 ? ' match' : ' matches') : '';
  }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { closePops(); all('.ov').forEach((ov) => { if (!ov.querySelector('.search').hidden) closeSearch(ov); }); }
  if (e.key === 'Enter' && !e.shiftKey && e.target.matches('.msg') && !matchMedia('(pointer:coarse)').matches) { e.preventDefault(); send(e.target.closest('.ov')); }
});

// Busy and idle, as the live state would drive them.
let secs = 31, timer = null;
const mmss = (s) => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
function paintClock() {
  all('[data-state]').forEach((n) => { n.textContent = 'thinking for ' + mmss(secs); });
  all('[data-tail]').forEach((n) => { n.textContent = 'running sh tools/check.sh for ' + mmss(secs); });
  all('.running').forEach((n) => { n.textContent = 'running for ' + mmss(secs); });
}
function setState(v) {
  const busy = v === 'busy';
  all('#m-state button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === v)));
  all('.ov').forEach((ov) => ov.classList.toggle('busy', busy));
  all('[data-busy]').forEach((n) => { n.hidden = !busy; });
  all('[data-idle]').forEach((n) => { n.hidden = busy; });
  all('[data-status]').forEach((c) => { c.className = 'ad-st ' + (busy ? 'run' : 'idle'); c.textContent = busy ? 'Working' : 'Idle'; });
  all('[data-send]').forEach((b) => {
    b.textContent = busy ? 'Queue' : 'Send';
    b.title = busy ? "atlas is busy: this waits in the queue and goes when it's free (Enter)" : 'Send (Enter). Shift+Enter for a new line';
  });
  document.getElementById('list-meta').textContent = (busy ? 'Working' : 'Idle') + ' · Hermes · 12s ago';
  clearInterval(timer);
  if (busy) { secs = 31; paintClock(); timer = setInterval(() => { secs++; paintClock(); }, 1000); }
  else all('[data-state]').forEach((n) => { n.textContent = 'idle, last step 10:46'; });
}
document.getElementById('m-state').onclick = (e) => { const b = e.target.closest('button'); if (b) setState(b.dataset.v); };
const openQuick = (e) => { if (e) e.preventDefault(); document.getElementById('quick').showModal(); };
document.getElementById('m-quick').onclick = () => openQuick();
document.getElementById('nav-fleet').onclick = openQuick;
// Phones get a placeholder short enough for one line beside Send; the slash hint stays in the full one.
const phone = matchMedia('(max-width:720px)');
const placeholders = () => all('.msg').forEach((t) => { t.placeholder = phone.matches ? 'Message atlas' : 'Message atlas, or / for commands'; });
phone.addEventListener('change', placeholders); placeholders();
setState('busy');
</script>
