<!DOCTYPE html>
<!--
  Mockup for ticket 3193: the Agents tab's hermes view and the Fleet quick view, drawn in the broker's own DOM
  and dash styles (docs/DESIGN.md) instead of the sidecar's embedded page. Static and self-contained: the
  tokens and components below are copied from dash.PAGE / transcript_assets.CSS, the data is made up.
  Phase 1 only. Nothing here is wired to the broker; phase 2 builds it in viewer/ui.js.

  What changes against today's view:
    - ONE header: back, name, status, harness, model and context, one actions menu. No second logo, no
      session pill row, no per-view theme toggle, no search or folder icons in a second bar.
    - Broker type scale and system fonts. No serif or italics, no gradient, no vignette.
    - Replies are the loudest thing in the body. Thinking and tool steps collapse into one quiet line per turn.
    - Composer: one Send. While the agent works, Send queues for the next turn; "Interrupt and send" is the
      secondary option behind the Send menu. Stop moves to the actions menu.
    - The theme follows the dash header button (try it).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>eph-broker · Agents mockup</title>
<style>
  :root{
    color-scheme:light;
    --bg:#f4f5f7; --s1:#ffffff; --s2:#f0f2f5; --s3:#e6e9ee; --line:#dce0e6;
    --t1:#141920; --t2:#475160; --t3:#626c7b; --brand:#2b57c9; --onbrand:#ffffff;
    --run:#17734a; --wait:#8a5600; --block:#bb3328; --shadow:0 1px 2px rgba(20,25,32,.05);
    --r:12px; --btn:120px;
  }
  :root[data-theme=dark]{
    color-scheme:dark;
    --bg:#0f1216; --s1:#161a20; --s2:#1d222a; --s3:#262c35; --line:#2b323c;
    --t1:#e8ecf1; --t2:#aab3bf; --t3:#8a94a2; --brand:#8eabff; --onbrand:#0c1120;
    --run:#4cc38a; --wait:#e3a63d; --block:#f27c71; --shadow:none;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme=light]){
      color-scheme:dark;
      --bg:#0f1216; --s1:#161a20; --s2:#1d222a; --s3:#262c35; --line:#2b323c;
      --t1:#e8ecf1; --t2:#aab3bf; --t3:#8a94a2; --brand:#8eabff; --onbrand:#0c1120;
      --run:#4cc38a; --wait:#e3a63d; --block:#f27c71; --shadow:none;
    }
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
       background:var(--bg);color:var(--t1);-webkit-font-smoothing:antialiased}
  code,pre{font-family:ui-monospace,SFMono-Regular,"JetBrains Mono",Menlo,monospace}
  button{font:inherit;color:var(--t1)}
  a{color:inherit}
  :focus-visible{outline:2px solid var(--brand);outline-offset:2px}

  /* ---- dash header (unchanged, here for context) */
  .top{position:sticky;top:0;z-index:5;background:var(--s1);border-bottom:1px solid var(--line)}
  .top-in{max-width:1440px;margin:0 auto;padding:0 40px;height:64px;display:flex;align-items:center;gap:28px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:650;font-size:16px;letter-spacing:-.01em;white-space:nowrap}
  .logo{width:24px;height:24px;border-radius:7px;background:var(--brand);position:relative;flex:none}
  .logo::before,.logo::after{content:"";position:absolute;left:22%;height:14%;border-radius:2px;background:var(--onbrand)}
  .logo::before{top:30%;width:56%} .logo::after{top:56%;width:36%}
  .inst{font-weight:400;font-size:13px;color:var(--t2)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--run)}
  .nav{display:flex;align-self:stretch;gap:4px}
  .nav a{display:flex;align-items:center;padding:0 14px;text-decoration:none;color:var(--t2);font-size:14px;border-bottom:3px solid transparent;margin-bottom:-1px}
  .nav a:hover{color:var(--t1)}
  .nav a[aria-current=page]{color:var(--t1);font-weight:600;border-bottom-color:var(--brand)}
  .top-r{margin-left:auto;display:flex;align-items:center;gap:12px}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:var(--btn);height:36px;padding:0 16px;
       border-radius:8px;border:1px solid var(--line);background:var(--s1);color:var(--t1);font-weight:600;font-size:14px;
       text-decoration:none;cursor:pointer;white-space:nowrap}
  .btn:hover{border-color:color-mix(in srgb,var(--t1) 28%,var(--line))}
  .btn:active{background:var(--s3);transform:translateY(1px)}
  .btn.pri{background:var(--brand);border-color:var(--brand);color:var(--onbrand)}
  .btn.pri:hover{background:color-mix(in srgb,var(--brand) 85%,var(--t1))}
  .btn.ghost{background:transparent;border-color:transparent}
  .btn.ghost:hover{background:var(--s2);border-color:var(--line)}
  .btn.sq{min-width:36px;width:36px;padding:0}
  .btn.bad{color:var(--block)}
  .lnk{color:var(--brand);font-weight:600;text-decoration:none;background:none;border:0;padding:0;cursor:pointer;font-size:14px}
  .lnk:hover{text-decoration:underline}
  .card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
  .page{max-width:1440px;margin:0 auto;padding:32px 40px 64px}
  .ph{display:flex;align-items:baseline;gap:12px;margin:0 0 20px}
  .ph h1{margin:0;font-size:28px;line-height:1.2;font-weight:650;letter-spacing:-.02em}
  .sub{font-size:13px;color:var(--t2)}
  .seg{display:inline-flex;background:var(--s3);border-radius:9px;padding:3px;gap:2px}
  .seg button{border:0;background:none;border-radius:7px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--t2);cursor:pointer;white-space:nowrap}
  .seg button[aria-pressed=true]{background:var(--s1);color:var(--t1);box-shadow:var(--shadow)}

  /* ---- mockup-only control strip (not part of the design) */
  .mock{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 16px;padding:10px 16px;border:1px dashed var(--line);
        border-radius:10px;font-size:13px;color:var(--t2)}
  .mock b{font-weight:600;color:var(--t1)}

  /* ---- status chip (viewer .ad-st) */
  .ad-st{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:2px 10px;border-radius:999px;
    white-space:nowrap;color:var(--t2);background:color-mix(in srgb,currentColor 13%,var(--s1))}
  .ad-st::before{content:'';flex:none;box-sizing:border-box;width:8px;height:8px;border-radius:50%;border:1.5px solid var(--t3)}
  .ad-st.run{color:var(--run)}.ad-st.run::before{border:0;background:currentColor}
  .ad-st.wait{color:var(--wait)}.ad-st.wait::before{border:2px solid currentColor}
  .ad-st.off{color:var(--t3)}.ad-st.off::before{border:0;height:2px;border-radius:1px;background:currentColor}
  .ad-meter{display:inline-block;width:56px;height:6px;border-radius:3px;background:var(--s3);overflow:hidden;vertical-align:middle;margin-right:6px}
  .ad-meter i{display:block;height:100%;background:var(--brand)}.ad-meter.warm i{background:var(--wait)}

  /* ---- Agents tab: directory + detail (viewer .adir) */
  .adir{display:grid;grid-template-columns:260px 1fr;gap:16px;align-items:start}
  .adir-list{padding:4px 0}
  .adir-it{display:flex;align-items:center;gap:12px;padding:14px 20px;border-left:3px solid transparent;color:inherit;text-decoration:none}
  .adir-it:hover{background:var(--s2)}
  .adir-it[aria-current=true]{background:color-mix(in srgb,var(--brand) 7%,var(--s1));border-left-color:var(--brand)}
  .adir-it.grey{color:var(--t2)}.adir-grow{flex:1;min-width:0}.adir-nm{font-weight:600}
  .adir-meta{font-size:13px;color:var(--t2)}
  .adir-dot{width:8px;height:8px;border-radius:50%;background:var(--brand)}
  .adir-detail{position:sticky;top:80px;display:flex;flex-direction:column;height:calc(100dvh - 96px - 56px);overflow:hidden}

  /* ONE header. Line 1: name, status, actions. Line 2: harness, model, context, session, last activity. */
  .vh{flex:none;display:grid;gap:6px;padding:14px 12px 14px 20px;border-bottom:1px solid var(--line)}
  .vh-top{display:flex;align-items:center;gap:12px;min-width:0}
  .vh-top h2{margin:0;font-size:18px;font-weight:650;letter-spacing:-.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .vh-top .sp{flex:1}
  .vh-now{margin:0;font-size:14px;overflow-wrap:anywhere}.vh-now b{color:var(--t2);font-weight:600;margin-right:6px}
  .vh-meta{display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--t2);font-variant-numeric:tabular-nums}
  .vh-meta .sess{color:var(--t1);font-weight:600}
  .back{display:none;color:var(--brand);font-size:14px;font-weight:600;text-decoration:none;white-space:nowrap}

  /* Single actions menu: a native popover anchored under the button. */
  .menu-w{position:relative}
  .menu{position:absolute;right:0;top:calc(100% + 6px);z-index:10;min-width:220px;padding:6px;margin:0;list-style:none;
        background:var(--s1);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(20,25,32,.12)}
  .menu button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;min-height:36px;padding:0 10px;
        border:0;background:none;border-radius:6px;font-size:14px;text-align:left;cursor:pointer}
  .menu button:hover{background:var(--s2)}
  .menu button.bad{color:var(--block)}
  .menu button span{font-size:13px;color:var(--t2)}
  .menu hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
  .menu .lbl{font-size:12px;font-weight:500;color:var(--t2);padding:6px 10px 2px}

  /* ---- transcript body: plain surface, broker transcript components */
  .tl{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:16px 20px 24px;background:var(--s1)}
  .tl > *{flex-shrink:0}
  .day{align-self:center;font-size:12px;color:var(--t2);padding:4px 0}
  .ev{max-width:760px;border-radius:14px;padding:10px 14px;border:1px solid var(--line);background:var(--s1)}
  .ev.user{background:color-mix(in srgb,var(--brand) 7%,var(--s1));border-color:color-mix(in srgb,var(--brand) 22%,var(--line));align-self:flex-end;max-width:620px}
  .ev.agent{border-color:transparent;padding-left:0;padding-right:0;max-width:760px}
  .ev-meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--t2);margin-bottom:2px}
  .who{font-weight:600;color:var(--t1)}
  .ev.user .who{color:var(--brand)}
  .ts{font-size:12px;color:var(--t3);font-variant-numeric:tabular-nums}
  .md p{margin:.35em 0} .md ul{margin:.35em 0;padding-left:1.4em}
  .md code{background:var(--s2);border:1px solid var(--line);border-radius:5px;padding:0 4px;font-size:12px}

  /* Steps: one quiet line per turn, collapsed by default. Quieter than any reply: 13px, --t2, no card fill. */
  details.steps{max-width:760px;font-size:13px;color:var(--t2)}
  details.steps > summary{list-style:none;display:inline-flex;align-items:center;gap:8px;padding:4px 8px;margin-left:-8px;
        border-radius:8px;cursor:pointer;font-variant-numeric:tabular-nums}
  details.steps > summary::-webkit-details-marker{display:none}
  details.steps > summary:hover{background:var(--s2);color:var(--t1)}
  details.steps > summary::after{content:"›";color:var(--t3);transition:transform .15s}
  details.steps[open] > summary::after{transform:rotate(90deg)}
  .steps-body{display:grid;gap:6px;margin:6px 0 4px 4px;padding-left:14px;border-left:2px solid var(--line)}
  .step{display:flex;align-items:baseline;gap:8px;min-width:0}
  .step .k{flex:none;font-weight:600;color:var(--t2);min-width:64px}
  .step .v{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .step code{font-size:12px;color:var(--t2)}
  .step.think .v{white-space:normal;color:var(--t2)}
  .step .ts{margin-left:auto;flex:none}

  /* Working line: the only live element in the body. A pulsing dot, the current step, elapsed time. */
  .working{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--t2);font-variant-numeric:tabular-nums}
  .working::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--run);animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.3}}

  /* ---- composer: one Send, Interrupt behind the Send menu */
  .comp{flex:none;display:grid;gap:6px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--s1)}
  .comp-row{display:flex;align-items:flex-end;gap:8px}
  .comp textarea{flex:1;min-width:0;resize:none;font:inherit;font-size:14px;line-height:20px;min-height:36px;max-height:140px;
        padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--s1);color:var(--t1)}
  .split{display:inline-flex;flex:none}
  .split .btn{min-width:0}
  .split .btn.main{border-radius:8px 0 0 8px}
  .split .btn.more{border-radius:0 8px 8px 0;border-left:1px solid color-mix(in srgb,var(--onbrand) 35%,var(--brand));width:32px;padding:0}
  .split .menu{bottom:calc(100% + 6px);top:auto;min-width:260px}
  .comp-hint{margin:0;font-size:12px;color:var(--t2)}

  /* ---- Fleet quick view: the dash detail sheet with the same header and composer */
  .detail-sheet{padding:0;color:var(--t1);width:min(640px,calc(100% - 32px));max-height:calc(100dvh - 32px);
                background:var(--s1);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:none}
  .detail-sheet[open]{display:flex;flex-direction:column}
  .detail-sheet::backdrop{background:color-mix(in srgb,var(--t1) 35%,transparent)}
  .detail-sheet .vh{padding:16px 16px 14px 24px}
  .qv{flex:1;min-height:0;overflow:auto;display:grid;align-content:start;gap:14px;padding:16px 24px}
  .qv-now{display:grid;gap:6px;padding:12px 16px;border-radius:12px;background:var(--s2)}
  .qv-now .lbl{font-size:12px;font-weight:600;color:var(--t2)}
  .qv-now p{margin:0}
  .qv-wait{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--wait)}
  .qv-wait::before{content:'';width:10px;height:10px;box-sizing:border-box;border-radius:50%;border:2px solid currentColor}
  .qv .lbl2{font-size:12px;font-weight:600;color:var(--t2);margin:4px 0 -6px}
  .qv .tl{padding:0;overflow:visible;background:none}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  /* ---- phone */
  @media (max-width:820px){
    .adir{grid-template-columns:1fr}.adir-listcard{display:none}
    .adir-detail{position:static;height:calc(100dvh - 64px - 32px - 48px)}
    .back{display:inline-flex;min-height:44px;align-items:center}
  }
  @media (max-width:720px){
    .top-in{padding:0 16px;gap:12px}.nav,.inst{display:none}
    .page{padding:16px 16px 24px}.ph{display:none}
    .mock{margin-bottom:12px}
    .vh{padding:6px 8px 10px 12px;gap:4px}.vh-top{gap:8px}.vh-top h2{font-size:16px}
    .vh-meta{font-size:12px;gap:2px 10px}.vh-meta .opt{display:none}
    .vh-now{font-size:13px}
    .tl{padding:12px}
    .ev.user{max-width:88%}
    .comp textarea{font-size:16px}
    .btn,.menu button{min-height:44px}
    .comp .btn.main{height:44px}.split .btn.more{height:44px;width:40px}
    .detail-sheet{width:100%;max-width:100%;margin:auto 0 0;border-radius:16px 16px 0 0;border-bottom:0;max-height:calc(100dvh - 48px)}
    .detail-sheet .vh{padding:12px 12px 12px 16px}.qv{padding:12px 16px}
  }
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand"><span class="logo" aria-hidden="true"></span>eph-broker <span class="inst">demo</span><span class="dot" aria-hidden="true"></span></div>
  <nav class="nav" aria-label="Views">
    <a href="#">Now</a><a href="#">Runs</a><a href="#">Queue</a>
    <a href="#" id="nav-fleet">Fleet</a><a href="#" aria-current="page">Agents</a>
  </nav>
  <div class="top-r">
    <button class="btn ghost sq" id="theme" type="button" aria-label="Theme: auto" title="Theme: auto">◐</button>
  </div>
</div></header>

<main class="page">
  <div class="ph"><h1>Agents</h1></div>

  <div class="mock" role="group" aria-label="Mockup controls">
    <b>Mockup</b>
    <span>Agent state</span>
    <div class="seg" id="m-state">
      <button type="button" aria-pressed="true" data-v="busy">Working</button>
      <button type="button" aria-pressed="false" data-v="idle">Idle</button>
    </div>
    <button class="lnk" type="button" id="m-quick">Open the Fleet quick view</button>
    <span>Theme follows the header button.</span>
  </div>

  <div class="adir">
    <div class="card adir-listcard">
      <nav class="adir-list" aria-label="Agents">
        <a class="adir-it" href="#" aria-current="true"><span class="adir-grow"><div class="adir-nm">atlas</div>
          <div class="adir-meta" id="list-meta">Working · Hermes · 12s ago</div></span></a>
        <a class="adir-it" href="#"><span class="adir-grow"><div class="adir-nm">kestrel</div>
          <div class="adir-meta">Online · Claude Code · 3m ago</div></span><span class="adir-dot" title="2 unread"></span></a>
        <a class="adir-it" href="#"><span class="adir-grow"><div class="adir-nm">juniper</div>
          <div class="adir-meta">Idle · Codex · 41m ago</div></span></a>
        <a class="adir-it grey" href="#"><span class="adir-grow"><div class="adir-nm">harbor</div>
          <div class="adir-meta">Offline · Hermes · 6h ago</div></span></a>
      </nav>
    </div>

    <section class="card adir-detail" aria-label="atlas">
      <div id="view-slot"></div>
    </section>
  </div>
</main>

<dialog class="detail-sheet" id="quick" aria-label="atlas quick view">
  <div id="quick-slot"></div>
</dialog>

<!-- Shared pieces, cloned into the Agents detail and the quick view so both read the same. -->
<template id="t-head">
  <div class="vh">
    <div class="vh-top">
      <a class="back" href="#">‹ Agents</a>
      <h2>atlas</h2>
      <span class="ad-st run" data-status>Working</span>
      <span class="sp"></span>
      <a class="lnk" href="#" data-full hidden>Open full view</a>
      <div class="menu-w">
        <button class="btn ghost sq" type="button" aria-label="Actions" title="Actions" aria-haspopup="menu" aria-expanded="false" data-menu>⋯</button>
        <div class="menu" role="menu" hidden>
          <div class="lbl">Session</div>
          <button type="button" role="menuitem">main <span>current</span></button>
          <button type="button" role="menuitem">fix-composer <span>2h ago</span></button>
          <button type="button" role="menuitem">New session</button>
          <hr>
          <button type="button" role="menuitem" data-toggle-steps>Show all steps</button>
          <button type="button" role="menuitem">Copy link</button>
          <hr>
          <button type="button" role="menuitem" class="bad" data-stop>Stop current turn</button>
        </div>
      </div>
      <button class="btn ghost sq" type="button" aria-label="Close" title="Close" data-close hidden>✕</button>
    </div>
    <p class="vh-now" data-now><b>Now</b>Running the viewer tests for the composer change.</p>
    <div class="vh-meta">
      <span>Hermes</span>
      <span>sonnet-4.5</span>
      <span><span class="ad-meter" title="61k of 200k context"><i style="width:31%"></i></span>61k</span>
      <span class="opt">Session <span class="sess">main</span></span>
      <span class="opt" data-last>Last activity 12s ago</span>
    </div>
  </div>
</template>

<template id="t-body">
  <div class="tl" aria-live="polite">
    <div class="day">Today</div>
    <div class="ev user"><div class="ev-meta"><span class="who">you</span><span class="ts">10:41 AM</span></div>
      <div class="md"><p>Can you check why the composer loses focus after sending on a phone?</p></div></div>
    <details class="steps"><summary>Thought, read 3 files, ran 1 command · 38s</summary>
      <div class="steps-body">
        <div class="step think"><span class="k">Thought</span><span class="v">The form resets the textarea height after submit, which re-renders the row; focus likely drops there.</span></div>
        <div class="step"><span class="k">Read</span><span class="v"><code>viewer/ui.js</code></span><span class="ts">10:41</span></div>
        <div class="step"><span class="k">Read</span><span class="v"><code>dash.py</code></span><span class="ts">10:41</span></div>
        <div class="step"><span class="k">Read</span><span class="v"><code>tests/test_viewer.py</code></span><span class="ts">10:42</span></div>
        <div class="step"><span class="k">Ran</span><span class="v"><code>python3 tests/test_viewer.py</code></span><span class="ts">10:42</span></div>
      </div>
    </details>
    <div class="ev agent"><div class="ev-meta"><span class="who">atlas</span><span class="ts">10:42 AM</span></div>
      <div class="md"><p>Found it. <code>grow()</code> runs after the submit handler replaces the quick-reply buttons, and on iOS that blurs the textarea. Keeping focus is a two-line change:</p>
        <ul><li>call <code>input.focus()</code> after a successful send</li><li>skip the quick-reply rebuild when the list did not change</li></ul>
        <p>Want me to make it?</p></div></div>
    <div class="ev user"><div class="ev-meta"><span class="who">you</span><span class="ts">10:44 AM</span></div>
      <div class="md"><p>Yes, and add a test.</p></div></div>
    <details class="steps"><summary>Edited 1 file, ran 2 commands · 1m 12s</summary>
      <div class="steps-body">
        <div class="step"><span class="k">Edited</span><span class="v"><code>viewer/ui.js</code></span><span class="ts">10:44</span></div>
        <div class="step"><span class="k">Ran</span><span class="v"><code>python3 tests/test_viewer.py</code></span><span class="ts">10:45</span></div>
        <div class="step"><span class="k">Ran</span><span class="v"><code>sh tools/check.sh</code></span><span class="ts">10:45</span></div>
      </div>
    </details>
    <div class="working" data-working>Working · running <code>sh tools/check.sh</code> · 24s</div>
  </div>
</template>

<template id="t-comp">
  <form class="comp" onsubmit="return false">
    <div class="comp-row">
      <textarea rows="1" placeholder="Message atlas" aria-label="Message atlas"></textarea>
      <div class="split menu-w">
        <button class="btn pri main" type="submit">Send</button>
        <button class="btn pri more" type="button" aria-label="More send options" title="More send options" aria-haspopup="menu" aria-expanded="false" data-menu data-busy-only>▾</button>
        <div class="menu" role="menu" hidden>
          <button type="button" role="menuitem">Interrupt and send <span>stops the current turn</span></button>
        </div>
      </div>
    </div>
    <p class="comp-hint" data-hint>atlas is working. Send queues your message for its next turn.</p>
  </form>
</template>

<template id="t-quick">
  <div class="qv">
    <div class="qv-now"><span class="lbl">Doing now</span><p>Running the viewer tests for the composer change.</p>
      <div class="qv-wait">Waiting on review from kestrel</div></div>
    <div class="lbl2">Latest</div>
  </div>
</template>

<script>
// Mockup behavior only: theme cycle, menus, state toggle, quick view. Nothing talks to the broker.
const root = document.documentElement, themes = ['auto', 'light', 'dark'], glyph = {auto: '◐', light: '☀', dark: '☾'};
let theme = 'auto';
document.getElementById('theme').onclick = (e) => {
  theme = themes[(themes.indexOf(theme) + 1) % 3];
  if (theme === 'auto') root.removeAttribute('data-theme'); else root.dataset.theme = theme;
  e.currentTarget.textContent = glyph[theme];
  e.currentTarget.title = e.currentTarget.ariaLabel = 'Theme: ' + theme;
};

const clone = (id) => document.getElementById(id).content.cloneNode(true);
function build(slot, quick) {
  const s = document.getElementById(slot);
  s.style.display = 'contents';
  s.append(clone('t-head'));
  if (quick) {
    const qv = clone('t-quick'), body = clone('t-body'), tl = body.querySelector('.tl');
    // The quick view shows the last few lines only.
    [...tl.children].slice(0, 4).forEach((n) => n.remove());
    const box = qv.querySelector('.qv'); box.append(tl);
    s.append(qv);
    s.querySelector('[data-close]').hidden = false;
    s.querySelector('[data-full]').hidden = false;
    s.querySelector('[data-now]').remove();
    s.querySelector('.back').remove();
  } else s.append(clone('t-body'));
  s.append(clone('t-comp'));
}
build('view-slot', false);
build('quick-slot', true);

document.addEventListener('click', (e) => {
  const opener = e.target.closest('[data-menu]');
  document.querySelectorAll('.menu').forEach((m) => {
    if (!opener || m !== opener.parentNode.querySelector('.menu')) {
      m.hidden = true; const b = m.parentNode.querySelector('[data-menu]'); if (b) b.setAttribute('aria-expanded', 'false');
    }
  });
  if (opener) {
    const m = opener.parentNode.querySelector('.menu');
    m.hidden = !m.hidden; opener.setAttribute('aria-expanded', String(!m.hidden));
  }
  const t = e.target.closest('[data-toggle-steps]');
  if (t) {
    const box = t.closest('.adir-detail, .detail-sheet'), all = box.querySelectorAll('details.steps');
    const open = ![...all].every((d) => d.open);
    all.forEach((d) => { d.open = open; });
    t.textContent = open ? 'Hide steps' : 'Show all steps';
    t.closest('.menu').hidden = true;
  }
  if (e.target.closest('[data-stop]')) setState('idle');
  if (e.target.closest('[data-close]')) document.getElementById('quick').close();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') document.querySelectorAll('.menu').forEach((m) => { m.hidden = true; });
});

function setState(v) {
  const busy = v === 'busy';
  document.querySelectorAll('#m-state button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === v)));
  document.querySelectorAll('[data-status]').forEach((c) => { c.className = 'ad-st ' + (busy ? 'run' : 'idle'); c.textContent = busy ? 'Working' : 'Idle'; });
  document.querySelectorAll('[data-working]').forEach((w) => { w.hidden = !busy; });
  document.querySelectorAll('[data-now]').forEach((n) => { n.hidden = !busy; });
  document.querySelectorAll('[data-stop]').forEach((n) => { n.disabled = !busy; n.hidden = !busy; });
  document.querySelectorAll('[data-hint]').forEach((h) => { h.hidden = !busy; });
  // Idle: Send is the only option. Working: the split arrow offers Interrupt and send.
  document.querySelectorAll('[data-busy-only]').forEach((b) => { b.hidden = !busy; });
  document.querySelectorAll('.split .main').forEach((b) => { b.style.borderRadius = busy ? '' : '8px'; });
  document.getElementById('list-meta').textContent = (busy ? 'Working' : 'Idle') + ' · Hermes · 12s ago';
}
document.getElementById('m-state').onclick = (e) => { const b = e.target.closest('button'); if (b) setState(b.dataset.v); };
document.getElementById('m-quick').onclick = () => document.getElementById('quick').showModal();
document.getElementById('nav-fleet').onclick = (e) => { e.preventDefault(); document.getElementById('quick').showModal(); };
setState('busy');
</script>
</body>
</html>
